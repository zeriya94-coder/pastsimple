    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Bangers&display=swap');

        :root {
            --comic-yellow: #FFDE00;
            --comic-blue: #00C2FF;
            --comic-red: #FF3366;
            --comic-pink: #FF99CC;
            --comic-green: #00E676;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--comic-blue);
            background-image: radial-gradient(circle, #ffffff33 2px, transparent 2px);
            background-size: 20px 20px;
            overflow: hidden; /* STRICTLY NO SCROLLING */
            user-select: none;
            touch-action: pan-y;
        }

        .font-comic { font-family: 'Bangers', cursive; letter-spacing: 2px; }
        
        .comic-box {
            background: white;
            border: 4px solid black;
            border-radius: 16px;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.1s ease-in-out;
        }
        
        .comic-btn {
            background: var(--comic-yellow);
            border: 4px solid black;
            border-radius: 12px;
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .comic-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }
        .comic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        }

        .comic-btn-red { background: var(--comic-red); color: white; }
        .comic-btn-blue { background: var(--comic-blue); color: black; }
        .comic-btn-green { background: var(--comic-green); color: black; }

        @keyframes pulse-urgent {
            0%, 100% { transform: scale(1); color: black; }
            50% { transform: scale(1.2); color: var(--comic-red); }
        }
        .urgent-time { animation: pulse-urgent 0.5s infinite; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes starburst {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .boss-bg {
            background: radial-gradient(circle, var(--comic-yellow) 20%, var(--comic-red) 100%);
            animation: starburst 4s infinite linear;
        }

        /* Puzzle Tap Targets */
        .puzzle-word {
            display: inline-block;
            padding: 12px 24px;
            margin: 6px;
            background: white;
            border: 4px solid black;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px black;
        }
        .puzzle-word:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px black; }

        input[type="text"], textarea { border: 4px solid black; box-shadow: 4px 4px 0px black; }
        input[type="text"]:focus, textarea:focus { outline: none; background: #fffde7; }
        
        /* Utility for strictly keeping things in bounds */
        .strict-flex-container { display: flex; flex-direction: column; height: 100%; min-h: 0; }
        .strict-flex-content { flex: 1; min-h: 0; overflow-y: auto; }
    </style>
</head>

        function setupNextQuestion() {
            const q = state.activeQuestions[state.currentQIndex];
            state.timeLeft = 20; // STRICT 20 SECONDS
            state.typingAttempts = 0;
            
            if (q.type === 'comp') {
                state.isReadingPassage = true;
                // Don't start timer during reading
                render();
            } else {
                state.isReadingPassage = false;
                if (q.type === 'puzzle') {
                    state.puzzlePoolWords = [...q.words];
                    state.puzzleSelectedWords = [];
                }
                render();
                
                if (q.type === 'fill' || q.type === 'fix' || q.type === 'build') {
                    setTimeout(() => {
                        const input = document.getElementById('type-input');
                        if(input) {
                            input.focus();
                            input.addEventListener('keypress', function(e) { if(e.key === 'Enter') checkType(); });
                        }
                    }, 100);
                }
                startTimer();
            }
        }

        function startCompQuestion() {
            state.isReadingPassage = false;
            render();
            setTimeout(() => {
                const input = document.getElementById('type-input');
                if(input) {
                    input.focus();
                    input.addEventListener('keypress', function(e) { if(e.key === 'Enter') checkType(); });
                }
            }, 100);
            startTimer();
        }

        function startTimer() {
            clearInterval(state.timer);
            updateTimerDisplay();
            
            state.timer = setInterval(() => {
                state.timeLeft--;
                updateTimerDisplay();
                
                if (state.timeLeft <= 0) {
                    clearInterval(state.timer);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const tDisplay = document.getElementById('timer-display');
            if(tDisplay) {
                tDisplay.innerText = state.timeLeft;
                if (state.timeLeft <= 5 && state.timeLeft > 0) {
                    tDisplay.classList.add('urgent-time');
                } else {
                    tDisplay.classList.remove('urgent-time');
                }
            }
        }

        function handleMCQ(selectedOption) {
            clearInterval(state.timer);
            const q = state.activeQuestions[state.currentQIndex];
            const isCorrect = selectedOption === q.correct;
            processAnswer(isCorrect, selectedOption, q.correct);
        }

        function renderPuzzleWords() {
            const poolBox = document.getElementById('puzzle-pool-box');
            const ansBox = document.getElementById('puzzle-answer-box');
            if(!poolBox || !ansBox) return;

            poolBox.innerHTML = state.puzzlePoolWords.map((w, i) => 
                `<span onclick="moveWord('pool', ${i})" class="puzzle-word">${w}</span>`
            ).join('');

            ansBox.innerHTML = state.puzzleSelectedWords.map((w, i) => 
                `<span onclick="moveWord('ans', ${i})" class="puzzle-word bg-yellow-300 shadow-[inset_0_0_0_2px_#FF9800]">${w}</span>`
            ).join('');
        }

        function moveWord(from, index) {
            if (from === 'pool') {
                state.puzzleSelectedWords.push(state.puzzlePoolWords[index]);
                state.puzzlePoolWords.splice(index, 1);
            } else {
                state.puzzlePoolWords.push(state.puzzleSelectedWords[index]);
                state.puzzleSelectedWords.splice(index, 1);
            }
            renderPuzzleWords();
        }

        function resetPuzzle() {
            const q = state.activeQuestions[state.currentQIndex];
            state.puzzlePoolWords = [...q.words];
            state.puzzleSelectedWords = [];
            renderPuzzleWords();
        }

        function checkPuzzle() {
            clearInterval(state.timer);
            const q = state.activeQuestions[state.currentQIndex];
            const userAnswer = state.puzzleSelectedWords.join(' ');
            const isCorrect = normalizeText(userAnswer) === normalizeText(q.correctStr);
            processAnswer(isCorrect, userAnswer, q.correctStr);
        }

        function checkType() {
            const q = state.activeQuestions[state.currentQIndex];
            const inputEl = document.getElementById('type-input');
            const userAnswer = inputEl.value;
            
            if(!userAnswer.trim()) return;

            const isCorrect = normalizeText(userAnswer) === normalizeText(q.correct);

            if (isCorrect) {
                clearInterval(state.timer);
                processAnswer(true, userAnswer, q.correct);
            } else {
                state.typingAttempts++;
                if (state.typingAttempts === 1 && state.timeLeft > 2) {
                    // Quick hint, keep timer running
                    const hintEl = document.getElementById('type-hint');
                    hintEl.classList.remove('hidden');
                    hintEl.innerText = getHint(q.correct, userAnswer);
                    inputEl.value = "";
                    inputEl.focus();
                } else {
                    clearInterval(state.timer);
                    processAnswer(false, userAnswer, q.correct);
                }
            }
        }

        function getHint(correct, userAns) {
            const userNorm = normalizeText(userAns);
            if (userNorm.includes('did') && (userNorm.includes('played') || userNorm.includes('watched') || userNorm.includes('went') || userNorm.includes('bought'))) {
                 return "HINT: After DID, use the BASE VERB! (e.g. play, go)";
            }
            if (correct.toLowerCase().startsWith('w') || correct.toLowerCase().startsWith('h')) {
                return "HINT: Start with a Wh- word! (What, Where, Who...)";
            }
            return "HINT: Check your spelling or past tense form!";
        }

        function checkGrammarRule(userAnswer) {
            const badPatterns = ["did went", "did played", "did watched", "didn't went", "didn't played", "didn't watched", "did bought", "didn't bought", "did cooked"];
            const norm = normalizeText(userAnswer);
            return badPatterns.some(p => norm.includes(p));
        }

        function processAnswer(isCorrect, userAnswer, correctAnswer) {
            const isBoss = (state.currentQIndex + 1) % 5 === 0;
            const points = isBoss ? 20 : 10;
            const team = state.teams[state.currentTeamIndex];
            team.answered++;

            let title, body, btnText;
            const needsGrammarRule = !isCorrect && checkGrammarRule(userAnswer);

            if (isCorrect) {
                team.score += points;
                team.correct++;
                if (isBoss) team.bossWins++;
                title = `<span class="text-green-500 drop-shadow-md">CORRECT!</span>`;
                body = `<div class="text-4xl text-blue-600 mb-6">+${points} POINTS</div>
                        <div class="text-5xl font-comic text-yellow-500 drop-shadow-[2px_2px_0_#000]">TEAM ${team.id} CONTINUES!</div>`;
                btnText = "NEXT QUESTION";
            } else {
                team.wrong++;
                title = `<span class="text-red-500 drop-shadow-md">NOT QUITE!</span>`;
                body = `<div class="text-3xl text-gray-600 mb-4">The correct answer was:</div>
                        <div class="text-4xl text-blue-600 bg-blue-100 p-6 rounded-2xl border-4 border-blue-500 inline-block mb-8 shadow-inner">${correctAnswer}</div>
                        <br><div class="text-5xl font-comic text-gray-800">NEXT TEAM: TEAM ${state.teams[(state.currentTeamIndex + 1) % state.teams.length].id}</div>`;
                btnText = "CONTINUE";
            }

            showModal(title, body, btnText, needsGrammarRule, isBoss && isCorrect, () => {
                if (!isCorrect) {
                    // Turn rule: Only change team if wrong or timeout
                    state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
                }
                advanceGame();
            });
        }

        function handleTimeout() {
            const team = state.teams[state.currentTeamIndex];
            team.timeouts++;
            team.answered++;
            const correctAnswer = state.activeQuestions[state.currentQIndex].correct || state.activeQuestions[state.currentQIndex].correctStr;
            
            const title = `<span class="text-orange-500 drop-shadow-md">TIME'S UP!</span>`;
            const body = `<div class="text-3xl text-gray-600 mb-4">The correct answer was:</div>
                        <div class="text-4xl text-blue-600 bg-blue-100 p-6 rounded-2xl border-4 border-blue-500 inline-block mb-8 shadow-inner">${correctAnswer}</div>
                        <br><div class="text-5xl font-comic text-gray-800">NEXT TEAM: TEAM ${state.teams[(state.currentTeamIndex + 1) % state.teams.length].id}</div>`;
            
            showModal(title, body, "CONTINUE", false, false, () => {
                // Change team on timeout
                state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
                advanceGame();
            });
        }

        function advanceGame() {
            state.currentQIndex++;
            if (state.currentQIndex >= state.activeQuestions.length) {
                state.screen = 'END';
                render();
            } else {
                setupNextQuestion();
            }
        }

        function confirmEndGame() {
            clearInterval(state.timer);
            showModal(
                "END THE GAME?", 
                "Are you sure you want to stop playing and see the results?", 
                "CANCEL", 
                false, false, 
                () => { if(state.isReadingPassage === false) startTimer(); }, 
                true 
            );
        }

        function showModal(title, body, btnText, showRule, showStars, onClose, isConfirm = false) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = body;
            
            const ruleDiv = document.getElementById('modal-rule');
            if(showRule) ruleDiv.classList.remove('hidden');
            else ruleDiv.classList.add('hidden');

            const stars1 = document.getElementById('modal-boss-stars');
            const stars2 = document.getElementById('modal-boss-stars-2');
            if(showStars) {
                stars1.classList.remove('hidden'); stars2.classList.remove('hidden');
            } else {
                stars1.classList.add('hidden'); stars2.classList.add('hidden');
            }

            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = () => {
                document.getElementById('modal-container').classList.add('hidden');
                document.getElementById('modal-container').classList.remove('flex');
                onClose();
            };

            const oldConfirmBtn = document.getElementById('modal-confirm-btn');
            if(oldConfirmBtn) oldConfirmBtn.remove();

            if (isConfirm) {
                btn.classList.add('bg-gray-400');
                btn.classList.remove('bg-yellow-400');
                
                const yesBtn = document.createElement('button');
                yesBtn.id = 'modal-confirm-btn';
                yesBtn.className = "comic-btn bg-red-500 text-white text-3xl py-4 px-8 w-full max-w-md mx-auto mt-4";
                yesBtn.innerText = "YES, END GAME";
                yesBtn.onclick = () => {
                    document.getElementById('modal-container').classList.add('hidden');
                    document.getElementById('modal-container').classList.remove('flex');
                    state.screen = 'END';
                    render();
                };
                document.getElementById('modal-content').appendChild(yesBtn);
            } else {
                btn.classList.add('bg-yellow-400');
                btn.classList.remove('bg-gray-400');
            }

            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-container').classList.add('flex');
        }

        function renderDashboard(app) {
            const sortedTeams = [...state.teams].sort((a,b) => b.score - a.score);
            const winner = sortedTeams[0];

            let html = `
                <div class="strict-flex-container p-6 items-center">
                    <div class="comic-box p-8 w-full max-w-7xl strict-flex-container bg-white/95">
                        <h1 class="font-comic text-6xl text-center mb-2 text-black uppercase flex-none">MOVIE STUDIO RESULTS</h1>
                        <h2 class="text-4xl font-bold text-center text-blue-600 mb-8 flex-none">🏆 GRAMMAR MOVIE CHAMPION 🏆<br><span class="text-6xl text-yellow-500 drop-shadow-[2px_2px_0_#000]" style="-webkit-text-stroke: 2px black;">${winner.name}</span></h2>
                        
                        <div class="flex-1 overflow-y-auto mb-8 border-4 border-black rounded-xl bg-gray-100 min-h-0">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-black text-white font-bold text-2xl sticky top-0 z-10 shadow-md">
                                    <tr>
                                        <th class="p-4 border-b-4 border-black text-center w-16">RANK</th>
                                        <th class="p-4 border-b-4 border-black">TEAM & PLAYERS</th>
                                        <th class="p-4 border-b-4 border-black text-center text-yellow-400">SCORE</th>
                                        <th class="p-4 border-b-4 border-black text-center text-green-400">✅</th>
                                        <th class="p-4 border-b-4 border-black text-center text-red-400">❌</th>
                                        <th class="p-4 border-b-4 border-black text-center text-orange-400">⏱️</th>
                                        <th class="p-4 border-b-4 border-black text-center text-blue-300">TOTAL Q</th>
                                        <th class="p-4 border-b-4 border-black text-center">⭐ BOSS</th>
                                    </tr>
                                </thead>
                                <tbody class="text-2xl font-bold">
                                    ${sortedTeams.map((t, idx) => `
                                        <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'} border-b-4 border-gray-300 hover:bg-yellow-50">
                                            <td class="p-4 font-comic text-4xl text-center">${idx + 1}</td>
                                            <td class="p-4">
                                                <div class="text-3xl mb-1">${t.name}</div>
                                                <div class="text-lg text-gray-500 font-normal truncate max-w-sm">${t.players.join(', ')}</div>
                                            </td>
                                            <td class="p-4 text-center text-4xl text-yellow-500 drop-shadow-sm" style="-webkit-text-stroke: 1px black;">${t.score}</td>
                                            <td class="p-4 text-center text-green-600">${t.correct}</td>
                                            <td class="p-4 text-center text-red-600">${t.wrong}</td>
                                            <td class="p-4 text-center text-orange-500">${t.timeouts}</td>
                                            <td class="p-4 text-center text-blue-600">${t.answered}</td>
                                            <td class="p-4 text-center text-yellow-500 text-3xl">${t.bossWins}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="flex flex-col md:flex-row justify-center gap-6 flex-none">
                            <button onclick="startGame()" class="comic-btn comic-btn-blue text-4xl py-5 px-12 w-full md:w-auto">PLAY AGAIN</button>
                            <button onclick="goToPlayers()" class="comic-btn bg-gray-300 text-black text-4xl py-5 px-12 w-full md:w-auto">NEW GAME</button>
                        </div>
                    </div>
                </div>
            `;
            app.innerHTML = html;
        }

        window.onload = () => {
            render(); 
        };
    </script>
</body>
</html>
